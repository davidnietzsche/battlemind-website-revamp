<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="lib/gate.js"></script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Story · Battle Website</title><meta name="robots" content="noindex"><link rel="icon" href="assets/brand/bm-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="lib/gsap.min.js"></script><script src="lib/ScrollTrigger.min.js"></script><script src="lib/lenis.min.js"></script>
<style>
/* About · our story, as ONE pinned film: scroll drives the camera through six old-master paintings.
   Techniques: pinned scrollytelling, scroll-scrubbed camera (push-in per scene, reverses on scroll up),
   two-layer parallax cloud wipes between scenes, reveals, Lenis smooth scroll. */
:root{--red:#D7000F;--umber:#2a0f08;--cream:#F5E9DA;--f:"Inter",system-ui,sans-serif;--s:"Instrument Serif",Georgia,serif;--gut:clamp(16px,4vw,56px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--umber);color:var(--cream);font:16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}a{color:inherit}
.top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px var(--gut);color:#fff;pointer-events:none}
.top>*{pointer-events:auto}
.top b{font:800 20px var(--f);letter-spacing:-.02em}.top b small{display:block;font:400 11px var(--f);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.top a{font:500 12px var(--f);letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.film{position:relative;height:100svh;overflow:hidden;background:var(--umber)}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity}
.scene.on{opacity:1}
.scene .paint{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,6,3,.5),transparent 30%,transparent 52%,rgba(30,10,5,.92) 88%);pointer-events:none}
.scene.intro{background:radial-gradient(70% 60% at 50% 40%,#5a1608,var(--umber) 70%)}
.scene.intro::after{display:none}
.ttl{position:absolute;left:0;right:0;top:13%;z-index:3;text-align:center;color:#fff;text-shadow:0 4px 40px rgba(40,10,0,.55)}
.ttl .k{font:500 12px var(--f);letter-spacing:.3em;text-transform:uppercase;opacity:.8;margin-bottom:12px}
.ttl .s{display:block;font:400 clamp(56px,8.6vw,146px)/.85 var(--s);text-transform:uppercase}
.ttl .b{display:block;font:800 clamp(56px,8.6vw,146px)/.85 var(--f);letter-spacing:-.05em;text-transform:uppercase}
.intro .ttl{top:50%;translate:0 -60%}
.intro .ttl .s{text-transform:none}
.story{position:absolute;left:0;right:0;bottom:7%;z-index:3;text-align:center;padding:0 var(--gut)}
.story h2{font:800 clamp(20px,1.8vw,26px)/1 var(--f);letter-spacing:-.02em;margin:0 0 12px;color:#FFB59A}
.story p{max-width:900px;margin:0 auto;font:400 clamp(24px,2.7vw,42px)/1.14 var(--s);text-shadow:0 2px 24px rgba(30,8,3,.9)}
.story p em{color:#FFB59A}
.story .as{display:inline-block;margin-top:18px;padding:10px 20px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(245,233,218,.55);font:500 11px var(--f);letter-spacing:.16em;text-transform:uppercase}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:1100px;margin:22px auto 0;text-align:left}
.vals div{padding:16px 18px;border-radius:18px;background:rgba(30,10,5,.55);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(245,233,218,.18)}
.vals b{display:block;font:400 21px/1.1 var(--s);color:#FFB59A;margin-bottom:4px}.vals span{font-size:13.5px;opacity:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;padding:16px 34px;border-radius:50%/50%;min-width:220px;box-shadow:inset 0 0 0 1px #fff;font:600 12px var(--f);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:#fff;transition:background .3s,color .3s}
.btn:hover{background:#fff;color:var(--red)}
/* cloud wipe: a band of painted clouds with solid umber below it, swept up across the frame between scenes */
.mist{position:absolute;left:-30%;width:160%;z-index:10;pointer-events:none;will-change:transform,opacity;opacity:0}
.mist img{width:100%;max-width:none;filter:brightness(.72) saturate(.9) sepia(.2) blur(1px);-webkit-mask-image:radial-gradient(ellipse 50% 55% at 50% 55%,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse 50% 55% at 50% 55%,#000 30%,transparent 72%)}
.mist.a{top:30%}.mist.b{top:48%;left:-10%;width:130%;z-index:9}
.rail{position:absolute;right:var(--gut);top:50%;translate:0 -50%;z-index:20;display:grid;gap:10px;justify-items:end}
.rail span{display:flex;align-items:center;gap:10px;font:400 14px var(--s);color:rgba(255,255,255,.45);transition:color .4s}
.rail span i{display:block;width:16px;height:1px;background:currentColor;transition:width .4s}
.rail span.on{color:#fff}.rail span.on i{width:40px}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#D7000F,#FFB59A);z-index:20}
.hint{position:absolute;left:50%;bottom:22px;translate:-50% 0;z-index:20;font:500 11px var(--f);letter-spacing:.26em;text-transform:uppercase;opacity:.7}
@media (max-width:860px){.rail{display:none}.vals{grid-template-columns:1fr 1fr}.vals span{display:none}.ttl{top:11%}.story{bottom:5%}}
</style></head>
<body>
<header class="top"><b>Battle<small>Our story · since 2020</small></b><a href="home-v3.html">Home</a></header>
<section class="film" id="film" aria-label="Our story, told in scenes as you scroll">
  <div id="scenes"></div>
  <div class="mist b" id="wf"><img src="assets/img/st_cloud_g.webp" alt=""></div>
  <div class="mist a" id="wn"><img src="assets/img/st_cloud_g.webp" alt=""></div>
  <nav class="rail" id="rail" aria-hidden="true"></nav>
  <div class="hint" id="hint">Scroll to begin</div>
  <div class="bar" id="bar"></div>
</section>
<script>
// [painting, focal x%, focal y%, title-serif, title-bold, story heading, story, aside] — story text from Battle's deck
const SC = [
  [null, 50, 50, "Meet the AI humans", "Behind the data", "", "AI ain't got a hold on us, because we're fun, we're cute, and we're <em>nerdily passionate</em> about your growth. We cry when you scold us, but we also celebrate with you when you win.", ""],
  ["st1", 30, 34, "The", "Storm", "Origin", "Battle Group was born in the downturn of the pandemic, when our founder's <em>events business came to a halt.</em>", "Dramatic. Dark. Epic."],
  ["st2", 46, 55, "The", "Light", "Epiphany", "In the darkness came the epiphany: going digital was <em>no longer optional</em> for businesses. It was essential.", "Seeing the light"],
  ["st3", 50, 46, "The love", "Child", "Bromance", "And so Battle Group was born: <em>a love child</em> between our founder and his long-time bromance partner, cum ex-superior.", "A reunion for the ages"],
  ["st4", 24, 42, "The", "Rescue", "Our first mission", "We started as a Meta ads specialist focused on lead generation, to help fellow SME owners <em>find quality customers.</em>", "Heroes, assemble"],
  ["st5", 46, 52, "The", "Heartbreak", "Why we care", "He knew the painstaking heartbreak of trying to reach the right clients. <em>We still feel it with every brand we take on.</em>", "An emotional monologue"],
  ["st6", 52, 44, "The", "Guardians", "Today", "Battle by battle we grew into a full digital marketing group, web included, serving <em>SMEs and corporates</em> across every industry.", "Spider Web Man · Super Leads Gen Man · Lord Meteoric ROAS Man"],
  ["st6", 50, 40, "The door is", "Open", "", "Need a Guardian for your Brand Galaxy, or a Super Leads Gen Man? Pop by our KL office or WhatsApp us. <em>Let's fight your biggest nemesis together.</em>", "fin"],
];
const NAMES = ["Intro", "Storm", "Light", "Love", "Rescue", "Heartbreak", "Guardians", "Open door"];
scenes.innerHTML = SC.map(([img, fx, fy, s, b, h, p, as], i) => `<div class="scene${img ? "" : " intro"}${i ? "" : " on"}" data-i="${i}">
  ${img ? `<img class="paint" src="assets/img/${img}.webp" alt="" style="transform-origin:${fx}% ${fy}%">` : ""}
  <div class="ttl">${i && i < 7 ? `<div class="k">Chapter ${i}</div>` : `<div class="k">${i ? "Let's talk" : "About Battle Group"}</div>`}<span class="s">${s}</span><span class="b">${b}</span></div>
  <div class="story">${h ? `<h2>${h}</h2>` : ""}<p>${p}</p>${as === "fin" ? `<div class="vals"><div><b>Empathy first</b><span>Your budget is treated like our own money.</span></div><div><b>Plain language</b><span>If we can't explain it simply, we haven't done it right.</span></div><div><b>Data + heart</b><span>Cold numbers, human understanding.</span></div><div><b>Fast replies</b><span>Never wait three days for a reply.</span></div></div><a class="btn" href="#">Let's talk</a>` : as ? `<span class="as">${as}</span>` : ""}</div></div>`).join("");
rail.innerHTML = NAMES.map((n, i) => `<span${i ? "" : ' class="on"'}>${n}<i></i></span>`).join("");
const S = [...document.querySelectorAll(".scene")], RL = [...rail.children], N = S.length, R = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (R) { // no motion: show the scenes as a plain stacked page
  film.style.height = "auto"; S.forEach((s) => { s.style.position = "relative"; s.style.height = "100svh"; s.classList.add("on"); }); wn.remove(); wf.remove(); hint.remove(); }
else {
  gsap.registerPlugin(ScrollTrigger);
  const lenis = new Lenis({ lerp: 0.07, wheelMultiplier: 0.9 }); lenis.on("scroll", ScrollTrigger.update); gsap.ticker.add((t) => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0);
  const tl = gsap.timeline({ defaults: { ease: "none" } }), SEG = 1;      // one unit of timeline per scene
  S.forEach((s, i) => i && gsap.set(s, { opacity: 0 }));
  S.forEach((sc, i) => {
    const t0 = i * SEG, paint = sc.querySelector(".paint"), tt = sc.querySelectorAll(".ttl > *"), st = sc.querySelectorAll(".story > *");
    if (i > 0) { // soft transition: mist swells and drifts across while the next painting dissolves in over the last one
      tl.fromTo(sc, { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "sine.inOut" }, t0 - 0.12)
        .to(S[i - 1], { opacity: 0, duration: 0.2, ease: "sine.in" }, t0 + 0.08)
        .fromTo(wn, { opacity: 0, x: () => innerWidth * 0.25, yPercent: 30 }, { keyframes: { opacity: [0, 0.95, 0], ease: "sine.inOut" }, x: () => -innerWidth * 0.25, yPercent: -40, duration: 0.6, ease: "none" }, t0 - 0.3)
        .fromTo(wf, { opacity: 0, x: () => -innerWidth * 0.2, yPercent: 40 }, { keyframes: { opacity: [0, 0.75, 0], ease: "sine.inOut" }, x: () => innerWidth * 0.2, yPercent: -20, duration: 0.7, ease: "none" }, t0 - 0.36);
    }
    if (paint) tl.fromTo(paint, { scale: 1.3 }, { scale: 1, duration: SEG + 0.35, ease: "none" }, t0 - 0.12);   // one continuous camera move, overlapping the crossfades   // the push-in camera
    if (i) tl.fromTo(tt, { y: 70, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.04, duration: 0.18, ease: "power3.out" }, t0 + 0.12)
      .fromTo(st, { y: 50, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.05, duration: 0.2, ease: "power3.out" }, t0 + 0.3);
    else { /* intro is already on screen at the top */ }
    if (i < N - 1) tl.to([...tt, ...st], { y: -40, opacity: 0, duration: 0.12, ease: "power2.in" }, t0 + SEG - 0.22);
  });
  tl.to({}, { duration: 0.25 });
  let cur = 0;
  ScrollTrigger.create({ trigger: film, start: "top top", end: () => "+=" + innerHeight * N * 1.25, pin: true, scrub: 1.2, animation: tl,
    onUpdate: (s) => { gsap.set(bar, { scaleX: s.progress }); hint.style.opacity = s.progress < 0.02 ? 0.7 : 0;
      const k = Math.min(N - 1, Math.floor(tl.time() / SEG + 0.06)); if (k !== cur) { cur = k; RL.forEach((r, i) => r.classList.toggle("on", i === k)); } } });
  gsap.from(S[0].querySelectorAll(".ttl > *, .story > *"), { y: 60, opacity: 0, duration: 1.3, stagger: 0.12, ease: "power3.out" });
}
</script>
</body></html>
